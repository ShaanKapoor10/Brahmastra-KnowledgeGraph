[project]
name = "brahmastra-backend"
version = "0.1.0"
description = "Brahmastra Concept Graph Engine — Python backend"
license = { text = "Elastic-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "jellyfish>=1.0.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    # Both SDK generations work: sync._iter_database_rows branches on whether
    # databases.query exists and falls back to data_sources.query, because the
    # 2025-09-03 Notion API split a database into data sources. The old <3 pin
    # locked out the current API for no remaining reason.
    "notion-client>=2.2.1",
    # Pinned below 2: mcp 2.0 restructured the package and removed
    # `mcp.server.fastmcp`, which this server is written against. Unpinned, a
    # clean image resolved 2.0.0 and MCP-over-HTTP failed at import with
    # ModuleNotFoundError -- so MCP_HTTP had never once worked in a container,
    # while the local dev environment on 1.28 was fine. Same shape as the pnpm
    # break: nothing here changed, the dependency shipped a major.
    # Moving to 2.x means porting to its `mcpserver` API; do it deliberately.
    "mcp>=1.0.0,<2",
    "groq>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Required whenever GRAPH_BACKEND=neo4j. Undeclared until now: it happened
    # to be present in the local venv, so nothing failed here, but a clean
    # install would import-error the moment the Neo4j backend was selected.
    "neo4j>=5.20.0",
    # Prometheus metrics at /metrics (brahmastra/metrics.py). Apache-2.0.
    "prometheus-client>=0.21,<1",
    # Not transitive-by-accident: neo4j_store passes an explicit certifi SSL
    # context, because a TLS-intercepting root CA makes the driver's default
    # verification fail with "self-signed certificate in certificate chain".
    "certifi>=2024.2.2",
    # Required whenever notes live in Postgres (NOTE_BACKEND=postgres), which
    # is the deployed arrangement: the system of record has to be networked and
    # has to support hybrid search. The [binary] extra avoids needing libpq and
    # a compiler on the host.
    "psycopg[binary]>=3.1",
    # pgvector is what keeps hybrid search alive after notes move off Neo4j.
    # NOTE: the Python package alone is not enough -- the SERVER needs the
    # `vector` extension, which a stock PostgreSQL build does not ship. Use the
    # pgvector/pgvector image (docker compose does). Without it PostgresStore
    # still stores notes but reports itself lexical-only, and CompositeStore
    # then refuses it rather than silently degrading search.
    "pgvector>=0.2.5",
    # Required whenever LLM_PROVIDER=gemini. Undeclared until now, so selecting
    # Gemini in a container failed at the first call with an ImportError: the
    # provider existed in llm.py but not in any image. Apache-2.0.
    "google-genai>=2.31.0",
    # The OpenAI wire format, used by LLM_PROVIDER=openai and =opencode (OpenCode
    # Zen serves DeepSeek and others behind an OpenAI-compatible endpoint).
    # Undeclared until now, so the openai provider existed in llm.py but in no
    # image -- the same gap google-genai had. Apache-2.0.
    "openai>=3.35.1",
]

[project.scripts]
brahmastra = "brahmastra.cli:app"

[tool.setuptools.packages.find]
include = ["brahmastra*"]

[tool.uv]
managed = true

# The CPU-only PyTorch index serves torch and NOTHING else. Letting a second
# index answer for any package is the dependency-confusion pattern; pinning it
# to torch means every other package comes only from PyPI. uv.lock carries a
# SHA-256 hash for every file, and every install is `uv sync --frozen`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Lint gate for CI (CONTRIBUTING.md). Ruff's own defaults -- errors and
# real bugs, not style -- so the gate is strict where it matters and every
# existing line already passes. A project config also overrides any personal
# ruff config a developer has, so CI and laptops agree.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402 (import not at top of file) is deliberate here: environment variables
# must be set BEFORE certain imports, because `brahmastra.stores` reads .env at
# import time (CLAUDE.md, "A throwaway python -c hits PRODUCTION").
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported for pytest's injection look unused, and their parameters
# shadow them by design.
"tests/*" = ["F401", "F811", "E702"]   # E702: one-line test tables

# Type-checking gate: the security- and operations-critical modules (accounts,
# auth, startup checks, logs, metrics, degradation, rebuild). Widened module by
# module; never narrowed.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = [
  "brahmastra/accounts.py", "brahmastra/auth.py", "brahmastra/preflight.py",
  "brahmastra/logs.py", "brahmastra/metrics.py", "brahmastra/graph_health.py",
  "brahmastra/graph_snapshot.py", "brahmastra/rebuild.py", "brahmastra/ingest/records.py",
  "brahmastra/ratelimit.py",
]

# CI and development tools only; never installed in the image.
[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
]
