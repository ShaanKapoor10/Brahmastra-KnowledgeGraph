# Dependency updates, grouped so a week of patches is one pull request, with a
# cooldown so a release has days in the wild before it reaches us (most
# malicious package versions are caught and pulled within that window).
# Security updates are not delayed by the cooldown.
#
# Every update still goes through ci-success: frozen installs, the test suite,
# the audits and the licence allowlist.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    cooldown: { default-days: 7, semver-major-days: 30 }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "deps(backend)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    cooldown: { default-days: 7, semver-major-days: 30 }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # The types describe the Node runtime (24, chosen in the docker section
    # below), so their major version moves with it, never on its own: 26 was
    # proposed for a dashboard running on 24.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message: { prefix: "deps(dashboard)" }

  - package-ecosystem: docker
    directories: [/backend, /frontend, /deploy/backup]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    cooldown: { default-days: 7 }
    # Digests are refreshed; the RUNTIME is chosen deliberately, never by a bot.
    # Its first run proposed Node 25 (not LTS, and without corepack, so the
    # build broke) and Python 3.14 (uv.lock is resolved for 3.12).
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]
    commit-message: { prefix: "deps(images)" }

  - package-ecosystem: docker-compose
    directories: [/deploy, /backend/tests]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    cooldown: { default-days: 7 }
    groups:
      service-images:
        patterns: ["*"]
    commit-message: { prefix: "deps(services)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: UTC }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "deps(ci)" }
