# Continuous integration. ONE check is required to merge: `ci-success`, which
# passes only when every job below passed. Adding a job means adding it to
# ci-success's `needs`, and the branch rule never has to change.
#
# Hardening (checked by zizmor in the workflow-lint job):
#   - the token is read-only by default; a job asks for more only if it needs it
#   - every action is pinned to a full commit SHA (Dependabot keeps them fresh)
#   - checkout never leaves credentials in .git/config
#   - no pull_request_target: a fork's code never runs with this repo's secrets
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; on main every
  # commit is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo
          ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
          --format plain .github/workflows

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The 14 Postgres integration tests run against this throwaway database
      # and nothing else (tests/conftest.py refuses any other connection).
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: brahmastra
          POSTGRES_PASSWORD: brahmastra-test
          POSTGRES_DB: brahmastra_test
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U brahmastra -d brahmastra_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      BRAHMASTRA_TEST_POSTGRES_DSN: postgresql://brahmastra:brahmastra-test@localhost:5439/brahmastra_test
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.30"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lock file matches pyproject.toml
        run: uv lock --check
      - name: Install (frozen, every file hash-checked)
        run: uv sync --frozen
      - name: ruff
        run: uv run --frozen --no-sync ruff check .
      - name: mypy
        run: uv run --frozen --no-sync mypy
      - name: pytest
        run: uv run --frozen --no-sync python -m pytest tests/ -q -p no:cacheprovider

  frontend:
    name: Dashboard (types, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
      - name: No sample data in the production build
        run: node scripts/check-no-sample-data.mjs

  deploy:
    name: Deploy configs and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt/deploy
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          --severity=warning -x
          lib.sh setup.sh upgrade.sh rebuild-graph.sh
          tests/edge-test.sh tests/smoke-test.sh tests/upgrade-path-test.sh tests/release-verify-test.sh
          backup/backup.sh backup/restore.sh backup/restore-test.sh backup/common.sh backup/entrypoint.sh
          monitoring/alertmanager/entrypoint.sh monitoring/tests/check-configs.sh
      - name: hadolint
        run: |
          for f in backend/Dockerfile frontend/Dockerfile deploy/backup/Dockerfile; do
            echo "== ${f}"
            docker run --rm -i \
              hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
              hadolint --failure-threshold warning - < "${f}"
          done
      - name: Compose files resolve
        # The template leaves secrets empty and compose refuses that (":?"), as
        # it should; placeholders let the rest of the file be checked.
        env:
          POSTGRES_PASSWORD: ci-placeholder
          NEO4J_PASSWORD: ci-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production.example config --quiet
          COMPOSE_PROFILES=monitoring \
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production.example config --quiet
      - name: Caddyfile is valid
        run: >
          docker run --rm -e DOMAIN=localhost -e CADDY_TLS=internal
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Edge rules (/metrics never leaves the internal network)
        run: deploy/tests/edge-test.sh
      - name: Monitoring rules, alert tests, Alertmanager receivers
        run: deploy/monitoring/tests/check-configs.sh
      - name: Release gate (upgrade.sh refuses unsigned or mismatched releases)
        run: deploy/tests/release-verify-test.sh

  images:
    name: Production images (smoke, upgrade path)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # the upgrade-path test needs the release tags
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: brahmastra-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: brahmastra-frontend:smoke
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          load: true
          tags: brahmastra-backup:smoke
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
      - name: Smoke test (non-root, read-only, no sample data, startup guard, /readyz)
        run: deploy/tests/smoke-test.sh
      - name: Upgrade from the previous release
        run: deploy/tests/upgrade-path-test.sh

  security:
    name: Security scans
    # "./" resolves to this same commit. zizmor prefers the newer "$/" form, which
    # actionlint 1.7.12 rejects; switch once actionlint accepts it.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write

  ci-success:
    name: ci-success
    if: always()
    needs: [workflow-lint, backend, frontend, deploy, images, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "${RESULTS}" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
