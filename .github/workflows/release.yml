# Release: a v* tag on a commit that is on main becomes signed images on GHCR
# and a signed manifest of their digests on the GitHub release.
#
#   check    the tag is a version, and its commit is on main (reviewed and
#            through ci-success: main accepts nothing else)
#   build    each image: built from the tag, pushed to GHCR (private), signed
#            with cosign keyless (Sigstore, this workflow's OIDC identity),
#            with SLSA build provenance and an SPDX SBOM
#   publish  release.env -- version, commit, image@sha256 digests -- signed as
#            a Sigstore bundle, attached to the GitHub release with the SBOMs
#   verify   runs deploy/lib.sh's prepare_release against the published
#            release: the exact code a server runs before it installs anything
#
# The identity servers trust is pinned in deploy/lib.sh: this repository, this
# file, the tag, and GitHub's OIDC issuer. Renaming this file or the repository
# means changing RELEASE_WORKFLOW / RELEASE_REPO there in the same commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never abandon a release half-published

jobs:
  check:
    name: Tag is a reviewed commit on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${TAG} is not a release version (vMAJOR.MINOR.PATCH[-pre])"; exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${TAG} points at a commit that is not on main; release only reviewed code"; exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build, sign, attest (${{ matrix.image.name }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # keyless signing and provenance
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
          - { name: backup, context: deploy/backup }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NAME: ${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: |
          mkdir -p dist
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brahmastra-${NAME}" >> "${GITHUB_OUTPUT}"
      # No build cache in a release: a cache any branch can write is a way into
      # the release (cache poisoning). Releases build from scratch.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.ref.outputs.image }}:${{ needs.check.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.licenses=Elastic-2.0
      - name: Sign the image by digest (keyless)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/brahmastra-${{ matrix.image.name }}-${{ needs.check.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record the digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}
        run: printf '%s\n' "${IMAGE}" > "dist/image-${NAME}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image.name }}
          path: dist/
          retention-days: 7

  publish:
    name: Signed manifest and GitHub release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # create the release
      id-token: write          # sign the manifest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Write release.env
        run: |
          {
            echo "VERSION=${VERSION}"
            echo "GIT_COMMIT=${GITHUB_SHA}"
            echo "BACKEND_IMAGE=$(cat dist/image-backend.txt)"
            echo "FRONTEND_IMAGE=$(cat dist/image-frontend.txt)"
            echo "BACKUP_IMAGE=$(cat dist/image-backup.txt)"
          } > dist/release.env
          cat dist/release.env
      - name: Sign release.env (Sigstore bundle)
        run: cosign sign-blob --yes --bundle dist/release.env.sigstore.json dist/release.env
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --title "Brahmastra ${VERSION}" \
            dist/release.env dist/release.env.sigstore.json dist/*.spdx.json

  verify:
    name: Verify as a server would
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: prepare_release (deploy/lib.sh) against the published release
        env:
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'GHCR_PULL_USER=%s\nGHCR_PULL_TOKEN=%s\n' "${GITHUB_ACTOR}" "${GHCR_PULL_TOKEN}" > deploy/.env.production
          trap 'rm -f deploy/.env.production' EXIT
          bash -c 'source deploy/lib.sh && prepare_release "${VERSION}"'
      - name: Images are private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          for name in backend frontend backup; do
            vis="$(gh api "/users/${owner}/packages/container/brahmastra-${name}" -q .visibility 2>/dev/null || echo unknown)"
            echo "brahmastra-${name}: ${vis}"
            if [ "${vis}" = public ]; then
              echo "::error::ghcr.io package brahmastra-${name} is PUBLIC; the decision was private images (docs/OPERATIONS.md)"; exit 1
            fi
          done
