<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="A planning doc says the launch is May 28; a later standup says June 10. scheduled_for holds one value, so the conflict is detected and the newer note wins."><title>Contradictions resolve to the newest note</title><desc>A planning doc says the launch is May 28; a later standup says June 10. scheduled_for holds one value, so the conflict is detected and the newer note wins.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1F"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626369"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DAD7D2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B86B00"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007A90"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#257C3A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C53443"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3461AC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes r1{0%,2.0%{opacity:0;transform:translateY(6px)}6.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r1{animation:r1 9s ease-out -8.10s infinite;transform-box:fill-box}@keyframes r2{0%,14.0%{opacity:0;transform:translateY(6px)}18.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r2{animation:r2 9s ease-out -8.10s infinite;transform-box:fill-box}@keyframes r3{0%,30.0%{opacity:0;transform:translateY(6px)}34.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r3{animation:r3 9s ease-out -8.10s infinite;transform-box:fill-box}@keyframes r4{0%,42.0%{opacity:0;transform:translateY(6px)}46.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r4{animation:r4 9s ease-out -8.10s infinite;transform-box:fill-box}@keyframes k5{0%,62.0%{stroke-dashoffset:208}67.0%,93.0%{stroke-dashoffset:0}96.0%,100%{stroke-dashoffset:208}}.k5{stroke-dasharray:208;animation:k5 9s ease-in-out -8.10s infinite}@keyframes w6{0%,52.0%{opacity:0}54.0%,64.0%{opacity:1}66.0%,100%{opacity:0}}.w6{animation:w6 9s linear -8.10s infinite}@keyframes r7{0%,70.0%{opacity:0;transform:translateY(6px)}74.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r7{animation:r7 9s ease-out -8.10s infinite;transform-box:fill-box}</style></defs><rect width="1200" height="360" rx="18" fill="#FDFCF9"/><line x1="60" y1="250" x2="760" y2="250" stroke="#DAD7D2" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="242" x2="200" y2="258" stroke="#626369" stroke-width="2" stroke-linecap="round"/><text x="200" y="280" font-size="12" class="m" fill="#626369" font-weight="600" text-anchor="middle">2 May</text><line x1="560" y1="242" x2="560" y2="258" stroke="#626369" stroke-width="2" stroke-linecap="round"/><text x="560" y="280" font-size="12" class="m" fill="#626369" font-weight="600" text-anchor="middle">20 May</text><g class="r1"><rect x="60" y="40" width="300" height="86" rx="12" fill="#F5F3EF" stroke="#DAD7D2" stroke-width="1.2" /><text x="80" y="66" font-size="12" class="m" fill="#626369">planning doc · 2 May</text><text x="80" y="98" font-size="15" class="s" fill="#1A1A1F">The launch is set for May 28.</text><line x1="200" y1="126" x2="200" y2="160" stroke="#626369" stroke-width="1.4" stroke-linecap="round"/></g><g class="r3"><rect x="420" y="40" width="300" height="86" rx="12" fill="#F5F3EF" stroke="#DAD7D2" stroke-width="1.2" /><text x="440" y="66" font-size="12" class="m" fill="#626369">standup · 20 May</text><text x="440" y="98" font-size="15" class="s" fill="#1A1A1F">We moved the launch to June 10.</text><line x1="560" y1="126" x2="560" y2="160" stroke="#626369" stroke-width="1.4" stroke-linecap="round"/></g><g class="r2"><rect x="86" y="166" width="228" height="30" rx="15.0" fill="#FDFCF9" stroke="#C53443" stroke-width="1.4"/><text x="200.0" y="185.32" font-size="12" class="m" fill="#1A1A1F" text-anchor="middle">launch <tspan fill="#C53443" font-weight="600">scheduled_for</tspan> May 28</text><line x1="96" y1="181" x2="304" y2="181" stroke="#C53443" stroke-width="2" class="k5"/></g><g class="r4"><rect x="442" y="166" width="236" height="30" rx="15.0" fill="#FDFCF9" stroke="#257C3A" stroke-width="1.4"/><text x="560.0" y="185.32" font-size="12" class="m" fill="#1A1A1F" text-anchor="middle">launch <tspan fill="#257C3A" font-weight="600">scheduled_for</tspan> June 10</text></g><g class="w6"><path d="M320 181 L 436 181" fill="none" stroke="#C53443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="378.0" y="160" font-size="12" class="s" fill="#C53443" font-weight="700" text-anchor="middle">conflict</text></g><g class="r7"><rect x="810" y="40" width="340" height="230" rx="12" fill="#F5F3EF" stroke="#257C3A" stroke-width="1.6" /><text x="830" y="68" font-size="11" class="s" fill="#257C3A" font-weight="600" letter-spacing="1.6">RESOLVED</text><text x="830" y="104" font-size="15" class="s" fill="#1A1A1F">launch is scheduled for</text><text x="830" y="134" font-size="26" class="s" fill="#257C3A" font-weight="700">June 10</text><text x="830" y="170" font-size="13" class="s" fill="#626369">May 28 stays in the evidence,</text><text x="830" y="190" font-size="13" class="s" fill="#626369">with its quote and its note.</text><text x="830" y="228" font-size="13" class="s" fill="#626369">Undated notes, or both said at once:</text><text x="830" y="248" font-size="13" class="s" fill="#626369">it answers “unresolved”, not a guess.</text></g><text x="60" y="320" font-size="13" class="s" fill="#626369">Five relations hold one value at a time: reports_to, has_status, scheduled_for, located_in,</text><text x="60" y="340" font-size="13" class="s" fill="#626369">employed_by. A second value is a contradiction, and the newer note wins.</text></svg>
