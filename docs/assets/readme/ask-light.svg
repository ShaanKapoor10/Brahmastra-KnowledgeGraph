<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="A question is answered from the graph first, by entity name and statement meaning. Only if the graph has nothing are raw transcript passages read, and the answer is marked as coming from the transcript."><title>Graph-first answers</title><desc>A question is answered from the graph first, by entity name and statement meaning. Only if the graph has nothing are raw transcript passages read, and the answer is marked as coming from the transcript.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1F"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626369"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DAD7D2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B86B00"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007A90"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#257C3A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C53443"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3461AC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs><rect width="1200" height="400" rx="18" fill="#FDFCF9"/><rect x="40" y="124" width="300" height="96" rx="16" fill="#F5F3EF" stroke="#DAD7D2" stroke-width="1.2" /><text x="60" y="152" font-size="11" class="s" fill="#626369" font-weight="600" letter-spacing="1.6">YOU ASK</text><text x="60" y="180" font-size="16" class="s" fill="#1A1A1F" font-weight="600">Why did the export API</text><text x="60" y="202" font-size="16" class="s" fill="#1A1A1F" font-weight="600">move to Friday?</text><rect x="410" y="50" width="300" height="130" rx="12" fill="#F5F3EF" stroke="#257C3A" stroke-width="1.6" /><text x="430" y="78" font-size="11" class="s" fill="#257C3A" font-weight="600" letter-spacing="1.6">1 · THE GRAPH</text><text x="430" y="108" font-size="14" class="s" fill="#1A1A1F">entities matched by name</text><text x="430" y="132" font-size="14" class="s" fill="#1A1A1F">statements matched by meaning</text><text x="430" y="160" font-size="12" class="m" fill="#626369">facts walked 1 to 3 hops</text><rect x="410" y="250" width="300" height="112" rx="12" fill="#F5F3EF" stroke="#B86B00" stroke-width="1.2" opacity="0.85"/><text x="430" y="278" font-size="11" class="s" fill="#B86B00" font-weight="600" letter-spacing="1.6">2 · ONLY IF THE GRAPH HAS NOTHING</text><text x="430" y="306" font-size="14" class="s" fill="#1A1A1F">the raw transcript passages,</text><text x="430" y="330" font-size="14" class="s" fill="#1A1A1F">with speaker and time</text><path d="M340 160 C 370 160, 380 115, 408 115" fill="none" stroke="#257C3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" class="flow"/><path d="M560 180 L 560 248" fill="none" stroke="#B86B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)" opacity="0.8" class="flow-slow"/><text x="572" y="220" font-size="11" class="m" fill="#B86B00" font-weight="600">NOT_IN_GRAPH</text><path d="M710 115 L 778 115" fill="none" stroke="#257C3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" class="flow"/><path d="M710 306 L 778 306" fill="none" stroke="#B86B00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)" opacity="0.8" class="flow-slow"/><rect x="780" y="50" width="380" height="150" rx="12" fill="#F5F3EF" stroke="#257C3A" stroke-width="1.6" /><rect x="800" y="66" width="115" height="22" rx="11.0" fill="#257C3A" stroke="#257C3A" stroke-width="1.2"/><text x="857.5" y="80.96" font-size="11" class="m" fill="#FDFCF9" font-weight="600" text-anchor="middle">from the graph</text><text x="800" y="118" font-size="15" class="s" fill="#1A1A1F">Priya moved it to Friday: Monday</text><text x="800" y="140" font-size="15" class="s" fill="#1A1A1F">hits the billing freeze.</text><text x="800" y="176" font-size="11" class="m" fill="#626369">said_by Priya · Q3 release sync · 00:04:12</text><rect x="780" y="50" width="380" height="150" rx="12" fill="#257C3A" class="breathe" fill-opacity="0.14"/><rect x="780" y="250" width="380" height="112" rx="12" fill="#F5F3EF" stroke="#B86B00" stroke-width="1.2" opacity="0.85"/><rect x="800" y="266" width="299" height="22" rx="11.0" fill="#FDFCF9" stroke="#B86B00" stroke-width="1.2"/><text x="949.5" y="280.96" font-size="11" class="m" fill="#B86B00" font-weight="600" text-anchor="middle">from the transcript, not in the graph yet</text><text x="800" y="316" font-size="14" class="s" fill="#1A1A1F">Still answered, and it also tells you</text><text x="800" y="338" font-size="14" class="s" fill="#1A1A1F">extraction missed something.</text></svg>
