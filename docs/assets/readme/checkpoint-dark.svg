<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="An AI session is captured to disk by a hook that cannot block, distilled by a model, and checked; a doubtful note is rejected and the capture stays queued. The raw conversation is indexed verbatim alongside."><title>Session checkpoints</title><desc>An AI session is captured to disk by a hook that cannot block, distilled by a model, and checked; a doubtful note is rejected and the capture stays queued. The raw conversation is indexed verbatim alongside.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes p1{0%{transform:translate(130px,99px);opacity:0}4%{opacity:1}4.0%{transform:translate(130px,99px)}26.0%{transform:translate(340px,99px)}48.0%{transform:translate(550px,99px)}70.0%{transform:translate(760px,99px)}92.0%{transform:translate(970px,99px)}92%{opacity:1}100%{transform:translate(970px,99px);opacity:0}}.p1{animation:p1 4.5s linear 0s infinite}</style></defs><rect width="1200" height="350" rx="18" fill="#0A0A0C"/><rect x="40" y="60" width="180" height="78" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.4" /><text x="130" y="92" font-size="15" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">An AI session</text><text x="130" y="114" font-size="11" class="s" fill="#929296" text-anchor="middle">your Claude Code chat</text><line x1="222" y1="99" x2="248" y2="99" stroke="#929296" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="250" y="60" width="180" height="78" rx="12" fill="#141417" stroke="#73A1DC" stroke-width="1.4" /><text x="340" y="92" font-size="15" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Capture</text><text x="340" y="114" font-size="11" class="s" fill="#929296" text-anchor="middle">file copy only, cannot block</text><line x1="432" y1="99" x2="458" y2="99" stroke="#929296" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="460" y="60" width="180" height="78" rx="12" fill="#141417" stroke="#73A1DC" stroke-width="1.4" /><text x="550" y="92" font-size="15" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Queue on disk</text><text x="550" y="114" font-size="11" class="s" fill="#929296" text-anchor="middle">survives a crash</text><line x1="642" y1="99" x2="668" y2="99" stroke="#929296" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="670" y="60" width="180" height="78" rx="12" fill="#141417" stroke="#F2B036" stroke-width="1.4" /><text x="760" y="92" font-size="15" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Distil</text><text x="760" y="114" font-size="11" class="s" fill="#929296" text-anchor="middle">a model writes the note</text><line x1="852" y1="99" x2="878" y2="99" stroke="#929296" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="880" y="60" width="180" height="78" rx="12" fill="#141417" stroke="#EA6878" stroke-width="1.4" /><text x="970" y="92" font-size="15" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Check</text><text x="970" y="114" font-size="11" class="s" fill="#929296" text-anchor="middle">fails closed</text><circle r="6" fill="#F2B036" class="p1"/><text x="130" y="50" font-size="11" class="m" fill="#929296" text-anchor="middle">PreCompact · SessionEnd · Stop</text><path d="M1062 99 C 1110 99, 1120 70, 1150 60" fill="none" stroke="#67B36A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" class="flow"/><path d="M1062 99 C 1110 99, 1120 128, 1150 140" fill="none" stroke="#EA6878" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-rose)" class="flow-slow"/><text x="1150" y="48" font-size="12" class="s" fill="#67B36A" font-weight="700" text-anchor="end">stored</text><text x="1150" y="160" font-size="12" class="s" fill="#EA6878" font-weight="700" text-anchor="end">kept queued</text><rect x="670" y="182" width="490" height="150" rx="12" fill="#1B1B1F" stroke="#2D2D31" stroke-width="1.2" /><text x="690" y="208" font-size="11" class="s" fill="#EA6878" font-weight="600" letter-spacing="1.6">VERIFIED BEFORE IT IS STORED</text><circle cx="694" cy="233" r="3.5" fill="#EA6878"/><text x="706" y="237" font-size="13" class="s" fill="#F1F1F4">every file and commit it names must appear in the session</text><circle cx="694" cy="259" r="3.5" fill="#EA6878"/><text x="706" y="263" font-size="13" class="s" fill="#F1F1F4">it must be a record of facts, never invented dialogue</text><circle cx="694" cy="285" r="3.5" fill="#EA6878"/><text x="706" y="289" font-size="13" class="s" fill="#F1F1F4">anything doubtful waits on disk for a retry</text><circle cx="694" cy="311" r="3.5" fill="#EA6878"/><text x="706" y="315" font-size="13" class="s" fill="#F1F1F4">nothing unverified ever reaches the graph</text><rect x="40" y="182" width="590" height="150" rx="12" fill="#1B1B1F" stroke="#2D2D31" stroke-width="1.2" /><text x="60" y="208" font-size="11" class="s" fill="#73A1DC" font-weight="600" letter-spacing="1.6">ALSO SEARCHABLE, WORD FOR WORD</text><text x="60" y="240" font-size="14" class="s" fill="#F1F1F4">The raw conversation is indexed verbatim, with</text><text x="60" y="262" font-size="14" class="s" fill="#F1F1F4">secrets redacted, so brahmastra_search_sessions</text><text x="60" y="284" font-size="14" class="s" fill="#F1F1F4">finds the exact words a summary dropped.</text><text x="60" y="318" font-size="14" class="s" fill="#F2B036" font-weight="700">A missing note is recoverable. A false note is not.</text></svg>
