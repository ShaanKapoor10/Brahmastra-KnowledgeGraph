<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Use case: Notion with a brain."><title>Notion with a brain</title><desc>Use case: Notion with a brain.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs><rect width="600" height="320" rx="18" fill="#0A0A0C"/><rect x="1" y="1" width="598" height="318" rx="18" fill="#0A0A0C" stroke="#2D2D31" stroke-width="1.2" /><text x="32" y="60" font-size="28" font-weight="800" class="s" fill="#F2B036">Notion, <tspan fill="#F1F1F4">with a brain</tspan></text><text x="32" y="90" font-size="15" class="s" fill="#929296">Write in Notion; <tspan fill="#F2B036" font-style="italic" font-weight="600">insights write themselves back.</tspan></text><rect x="32" y="116" width="220" height="140" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="48" y="140" font-size="10" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.6">NOTION PAGE</text><text x="48" y="168" font-size="14" class="s" fill="#F1F1F4" font-weight="700">Q3 launch plan</text><rect x="48" y="188" width="176" height="6" rx="3" fill="#2D2D31"/><rect x="48" y="204" width="150" height="6" rx="3" fill="#2D2D31"/><rect x="48" y="220" width="168" height="6" rx="3" fill="#2D2D31"/><rect x="48" y="236" width="120" height="6" rx="3" fill="#2D2D31"/><rect x="348" y="116" width="220" height="140" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="364" y="140" font-size="10" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.6">WRITTEN BACK</text><text x="364" y="164" font-size="12" class="s" fill="#F1F1F4" font-weight="700">▾ Brahmastra Insights</text><text x="364" y="188" font-size="12" class="m" fill="#F1F1F4">  relationships</text><text x="364" y="209" font-size="12" class="m" fill="#EA6878" font-weight="600">  contradictions</text><text x="364" y="230" font-size="12" class="m" fill="#14BBC2" font-weight="600">  suggested links</text><path d="M262 186 L 338 186" fill="none" stroke="#F2B036" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)" class="flow"/><text x="300" y="176" font-size="10" class="m" fill="#F2B036" font-weight="700" text-anchor="middle" letter-spacing="1.4">SYNC</text><rect x="32" y="276" width="104" height="24" rx="12" fill="#F2B036" fill-opacity="0.14"/><text x="84.0" y="292" font-size="11" class="m" fill="#F2B036" font-weight="700" text-anchor="middle" letter-spacing="1">TWO-WAY SYNC</text><rect x="144" y="276" width="104" height="24" rx="12" fill="#F2B036" fill-opacity="0.14"/><text x="196.0" y="292" font-size="11" class="m" fill="#F2B036" font-weight="700" text-anchor="middle" letter-spacing="1">NO [[LINKS]]</text><text x="568" y="293" font-size="11" class="m" fill="#929296" font-weight="700" text-anchor="end" letter-spacing="1.4">DOCS →</text></svg>
