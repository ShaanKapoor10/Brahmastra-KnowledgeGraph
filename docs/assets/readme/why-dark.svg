<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Four promises: it remembers for months, one brain is shared by every device, every fact has a source, and it is honest about what it does not know."><title>Why Brahmastra</title><desc>Four promises: it remembers for months, one brain is shared by every device, every fact has a source, and it is honest about what it does not know.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs><rect width="1200" height="440" rx="18" fill="#0A0A0C"/><text x="30" y="48" font-size="12" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.6">01 · MEMORY</text><g class="pulse"><circle cx="268" cy="44" r="4" fill="#F2B036"/></g><text x="150" y="300" font-size="22" class="s" fill="#F2B036" font-weight="700" text-anchor="middle">Remembers for months</text><text x="150" y="330" font-size="14" class="s" fill="#929296" text-anchor="middle">Every session builds on the last.</text><text x="150" y="351" font-size="14" class="s" fill="#929296" text-anchor="middle">No assistant starts from zero.</text><text x="330" y="48" font-size="12" class="m" fill="#14BBC2" font-weight="700" letter-spacing="1.6">02 · SHARED</text><g class="pulse"><circle cx="568" cy="44" r="4" fill="#14BBC2"/></g><text x="450" y="300" font-size="22" class="s" fill="#14BBC2" font-weight="700" text-anchor="middle">One brain, every device</text><text x="450" y="330" font-size="14" class="s" fill="#929296" text-anchor="middle">Claude Code, Cursor and your agents</text><text x="450" y="351" font-size="14" class="s" fill="#929296" text-anchor="middle">read and write the same memory.</text><text x="630" y="48" font-size="12" class="m" fill="#67B36A" font-weight="700" letter-spacing="1.6">03 · GROUNDED</text><g class="pulse"><circle cx="868" cy="44" r="4" fill="#67B36A"/></g><text x="750" y="300" font-size="22" class="s" fill="#67B36A" font-weight="700" text-anchor="middle">Every fact has a source</text><text x="750" y="330" font-size="14" class="s" fill="#929296" text-anchor="middle">Facts keep the sentence they came</text><text x="750" y="351" font-size="14" class="s" fill="#929296" text-anchor="middle">from. Answers cite their notes.</text><text x="930" y="48" font-size="12" class="m" fill="#EA6878" font-weight="700" letter-spacing="1.6">04 · HONEST</text><g class="pulse"><circle cx="1168" cy="44" r="4" fill="#EA6878"/></g><text x="1050" y="300" font-size="22" class="s" fill="#EA6878" font-weight="700" text-anchor="middle">Honest about doubt</text><text x="1050" y="330" font-size="14" class="s" fill="#929296" text-anchor="middle">Conflicts are caught, the newest wins,</text><text x="1050" y="351" font-size="14" class="s" fill="#929296" text-anchor="middle">and the unknown stays “unresolved”.</text><rect x="62" y="84" width="36" height="26" rx="8" fill="#141417" stroke="#F2B036" stroke-width="1.2" opacity="0.45"/><text x="80" y="101" font-size="10" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Mon</text><path d="M80 112 C 80 160, 150 170, 150 196" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" class="flow"/><rect x="106" y="84" width="36" height="26" rx="8" fill="#141417" stroke="#F2B036" stroke-width="1.2" opacity="0.58"/><text x="124" y="101" font-size="10" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Tue</text><path d="M124 112 C 124 160, 150 170, 150 196" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" class="flow"/><rect x="150" y="84" width="36" height="26" rx="8" fill="#141417" stroke="#F2B036" stroke-width="1.2" opacity="0.71"/><text x="168" y="101" font-size="10" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Wed</text><path d="M168 112 C 168 160, 150 170, 150 196" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" class="flow"/><rect x="194" y="84" width="36" height="26" rx="8" fill="#141417" stroke="#F2B036" stroke-width="1.2" opacity="0.84"/><text x="212" y="101" font-size="10" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Thu</text><path d="M212 112 C 212 160, 150 170, 150 196" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" class="flow"/><rect x="238" y="84" width="36" height="26" rx="8" fill="#141417" stroke="#F2B036" stroke-width="1.2" opacity="0.97"/><text x="256" y="101" font-size="10" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Fri</text><path d="M256 112 C 256 160, 150 170, 150 196" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" class="flow"/><circle cx="150" cy="214" r="34" fill="#F2B036" fill-opacity="0.22" class="breathe"/><circle cx="150" cy="214" r="20" fill="#F2B036" class="pulse"/><g transform="translate(140 204) scale(0.85)" fill="none" stroke="#0A0A0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.6"/><circle cx="12" cy="5" r="2.6"/><circle cx="19" cy="16" r="2.6"/><path d="M6.5 16 L10.8 7.3 M13.8 6.6 L17.6 13.8 M7.6 18 L16.4 16.3"/></g><circle cx="450" cy="166" r="38" fill="#14BBC2" fill-opacity="0.22" class="breathe"/><circle cx="450" cy="166" r="20" fill="#14BBC2" class="pulse"/><g transform="translate(440 156) scale(0.85)" fill="none" stroke="#0A0A0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.6"/><circle cx="12" cy="5" r="2.6"/><circle cx="19" cy="16" r="2.6"/><path d="M6.5 16 L10.8 7.3 M13.8 6.6 L17.6 13.8 M7.6 18 L16.4 16.3"/></g><path d="M378.0 122.6 L 421.2 147.4" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="337" y="92" width="34" height="22" rx="4" fill="#141417" stroke="#14BBC2" stroke-width="1.6"/><line x1="333" y1="118" x2="375" y2="118" stroke="#14BBC2" stroke-width="1.6" stroke-linecap="round"/><path d="M522.0 122.6 L 478.8 147.4" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="529" y="92" width="34" height="22" rx="4" fill="#141417" stroke="#14BBC2" stroke-width="1.6"/><line x1="525" y1="118" x2="567" y2="118" stroke="#14BBC2" stroke-width="1.6" stroke-linecap="round"/><path d="M378.0 209.4 L 421.2 184.6" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="337" y="216" width="34" height="22" rx="4" fill="#141417" stroke="#14BBC2" stroke-width="1.6"/><line x1="333" y1="242" x2="375" y2="242" stroke="#14BBC2" stroke-width="1.6" stroke-linecap="round"/><path d="M522.0 209.4 L 478.8 184.6" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="529" y="216" width="34" height="22" rx="4" fill="#141417" stroke="#14BBC2" stroke-width="1.6"/><line x1="525" y1="242" x2="567" y2="242" stroke="#14BBC2" stroke-width="1.6" stroke-linecap="round"/><rect x="660" y="76" width="180" height="70" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="676" y="92" width="140" height="6" rx="3" fill="#2D2D31"/><rect x="676" y="108" width="110" height="6" rx="3" fill="#67B36A"/><rect x="676" y="124" width="128" height="6" rx="3" fill="#2D2D31"/><path d="M750 146 L 750 172" fill="none" stroke="#67B36A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="658" y="174" width="156" height="26" rx="13.0" fill="#0A0A0C" stroke="#67B36A" stroke-width="1.4"/><text x="736.0" y="190.96" font-size="11" class="m" fill="#F1F1F4" text-anchor="middle">Priya <tspan fill="#67B36A" font-weight="600">decided</tspan> Friday</text><path d="M750 200 L 750 222" fill="none" stroke="#67B36A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="750" y="244" font-size="12" text-anchor="middle" class="m" fill="#F1F1F4">ships Friday <tspan fill="#67B36A" font-weight="700">[n:4f2a]</tspan></text><rect x="988" y="86" width="72" height="26" rx="13.0" fill="#0A0A0C" stroke="#EA6878" stroke-width="1.2"/><text x="1024.0" y="103.32" font-size="12" class="m" fill="#EA6878" font-weight="600" text-anchor="middle">May 28</text><line x1="996" y1="99" x2="1052" y2="99" stroke="#EA6878" stroke-width="2"/><rect x="988" y="132" width="80" height="26" rx="13.0" fill="#67B36A" stroke="#67B36A" stroke-width="1.2"/><text x="1028.0" y="149.32" font-size="12" class="m" fill="#0A0A0C" font-weight="600" text-anchor="middle">June 10</text><text x="1080" y="150" font-size="12" class="s" fill="#67B36A" font-weight="600">newest wins</text><text x="1072" y="104" font-size="12" class="s" fill="#929296">older</text><rect x="988" y="196" width="102" height="26" rx="13.0" fill="#0A0A0C" stroke="#929296" stroke-width="1.2"/><text x="1039.0" y="213.32" font-size="12" class="m" fill="#929296" font-weight="600" text-anchor="middle">unresolved</text><text x="988" y="244" font-size="12" class="s" fill="#929296">when the notes can't say</text><g class="blink"><circle cx="1112" cy="209" r="4" fill="#EA6878"/></g><text x="600" y="408" font-size="15" text-anchor="middle" font-style="italic" class="s" fill="#929296">Write once. Remember for months. <tspan fill="#F2B036" font-weight="700">Trace every answer.</tspan></text></svg>
