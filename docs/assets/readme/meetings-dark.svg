<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Quoted transcript lines become a decision decided by Priya, an action item assigned to Raj and later marked done from his own words, and a risk raised by Mei, all discussed in the meeting."><title>A meeting becomes graph knowledge</title><desc>Quoted transcript lines become a decision decided by Priya, an action item assigned to Raj and later marked done from his own words, and a risk raised by Mei, all discussed in the meeting.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes w1{0%,2.0%{opacity:0}4.0%,93.0%{opacity:1}95.0%,100%{opacity:0}}.w1{animation:w1 12s linear -10.80s infinite}@keyframes w2{0%,22.0%{opacity:0}24.0%,93.0%{opacity:1}95.0%,100%{opacity:0}}.w2{animation:w2 12s linear -10.80s infinite}@keyframes w3{0%,42.0%{opacity:0}44.0%,93.0%{opacity:1}95.0%,100%{opacity:0}}.w3{animation:w3 12s linear -10.80s infinite}@keyframes w4{0%,62.0%{opacity:0}64.0%,93.0%{opacity:1}95.0%,100%{opacity:0}}.w4{animation:w4 12s linear -10.80s infinite}@keyframes r5{0%,8.0%{opacity:0;transform:translateY(6px)}12.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r5{animation:r5 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r6{0%,28.0%{opacity:0;transform:translateY(6px)}32.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r6{animation:r6 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r7{0%,48.0%{opacity:0;transform:translateY(6px)}52.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r7{animation:r7 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r8{0%,68.0%{opacity:0;transform:translateY(6px)}72.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r8{animation:r8 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r9{0%,80.0%{opacity:0;transform:translateY(6px)}84.0%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r9{animation:r9 12s ease-out -10.80s infinite;transform-box:fill-box}</style></defs><rect width="1200" height="570" rx="18" fill="#0A0A0C"/><rect x="40" y="40" width="520" height="450" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="62" y="70" font-size="12" class="m" fill="#929296">Q3 release sync · transcript</text><rect x="52" y="94" width="496" height="74" rx="8" fill="#F2B036" fill-opacity="0.22" class="w1"/><text x="64" y="114" font-size="12" class="m" fill="#929296">00:04:12</text><text x="146" y="114" font-size="14" class="s" fill="#F2B036" font-weight="700">Priya</text><text x="146" y="138" font-size="14" class="s" fill="#F1F1F4">“Let's ship the export API on Friday, not</text><text x="146" y="160" font-size="14" class="s" fill="#F1F1F4">Monday. Monday hits the billing freeze.”</text><rect x="52" y="190" width="496" height="52" rx="8" fill="#14BBC2" fill-opacity="0.22" class="w2"/><text x="64" y="210" font-size="12" class="m" fill="#929296">00:05:40</text><text x="146" y="210" font-size="14" class="s" fill="#14BBC2" font-weight="700">Raj</text><text x="146" y="234" font-size="14" class="s" fill="#F1F1F4">“I'll take the reconciliation script.”</text><rect x="52" y="260" width="496" height="74" rx="8" fill="#EA6878" fill-opacity="0.22" class="w3"/><text x="64" y="280" font-size="12" class="m" fill="#929296">00:07:03</text><text x="146" y="280" font-size="14" class="s" fill="#EA6878" font-weight="700">Mei</text><text x="146" y="304" font-size="14" class="s" fill="#F1F1F4">“Staging is blocked until security</text><text x="146" y="326" font-size="14" class="s" fill="#F1F1F4">signs off.”</text><rect x="52" y="356" width="496" height="74" rx="8" fill="#14BBC2" fill-opacity="0.22" class="w4"/><text x="64" y="376" font-size="12" class="m" fill="#929296">00:31:15</text><text x="146" y="376" font-size="14" class="s" fill="#14BBC2" font-weight="700">Raj</text><text x="146" y="400" font-size="14" class="s" fill="#F1F1F4">“Reconciliation is done, I merged</text><text x="146" y="422" font-size="14" class="s" fill="#F1F1F4">it this morning.”</text><g class="r5"><rect x="640" y="60" width="330" height="92" rx="12" fill="#141417" stroke="#F2B036" stroke-width="1.6" /><text x="658" y="86" font-size="11" class="s" fill="#F2B036" font-weight="600" letter-spacing="1.6">DECISION</text><text x="658" y="114" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Ship the export API Friday</text><text x="658" y="136" font-size="11" class="s" fill="#929296">a statement, with its quote</text><line x1="970" y1="106" x2="1050" y2="106" stroke="#F2B036" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-amber)"/><text x="1010" y="98" font-size="10" class="m" fill="#929296" text-anchor="middle">decided_by</text><circle cx="1080" cy="106" r="26" fill="#F2B036"/><text x="1080" y="111" font-size="12" class="s" fill="#0A0A0C" font-weight="700" text-anchor="middle">Priya</text></g><g class="r5"><path d="M548 114 C 590 114, 600 106, 638 106" fill="none" stroke="#F2B036" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" class="flow"/></g><g class="r6"><rect x="640" y="196" width="330" height="92" rx="12" fill="#141417" stroke="#14BBC2" stroke-width="1.6" /><text x="658" y="222" font-size="11" class="s" fill="#14BBC2" font-weight="600" letter-spacing="1.6">ACTION ITEM</text><text x="658" y="250" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Reconciliation script</text><text x="658" y="272" font-size="11" class="s" fill="#929296">its status comes from what was said</text><line x1="970" y1="242" x2="1050" y2="242" stroke="#14BBC2" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-cyan)"/><text x="1010" y="234" font-size="10" class="m" fill="#929296" text-anchor="middle">assigned_to</text><circle cx="1080" cy="242" r="26" fill="#14BBC2"/><text x="1080" y="247" font-size="12" class="s" fill="#0A0A0C" font-weight="700" text-anchor="middle">Raj</text></g><g class="r6"><path d="M548 210 C 590 210, 600 242, 638 242" fill="none" stroke="#14BBC2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" class="flow"/></g><g class="r7"><rect x="640" y="330" width="330" height="92" rx="12" fill="#141417" stroke="#EA6878" stroke-width="1.6" /><text x="658" y="356" font-size="11" class="s" fill="#EA6878" font-weight="600" letter-spacing="1.6">RISK</text><text x="658" y="384" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Staging blocked on sign-off</text><text x="658" y="406" font-size="11" class="s" fill="#929296">a statement, with its quote</text><line x1="970" y1="376" x2="1050" y2="376" stroke="#EA6878" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-rose)"/><text x="1010" y="368" font-size="10" class="m" fill="#929296" text-anchor="middle">raised_by</text><circle cx="1080" cy="376" r="26" fill="#EA6878"/><text x="1080" y="381" font-size="12" class="s" fill="#0A0A0C" font-weight="700" text-anchor="middle">Mei</text></g><g class="r7"><path d="M548 280 C 590 280, 600 376, 638 376" fill="none" stroke="#EA6878" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" class="flow"/></g><g class="r8"><rect x="866" y="208" width="57" height="24" rx="12.0" fill="#67B36A" stroke="#67B36A" stroke-width="1.2"/><text x="894.5" y="224.32" font-size="12" class="m" fill="#0A0A0C" font-weight="600" text-anchor="middle">done</text><path d="M548 376 C 596 376, 600 272, 638 272" fill="none" stroke="#67B36A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" class="flow"/></g><g class="r9"><rect x="640" y="446" width="520" height="44" rx="22" fill="#141417" stroke="#73A1DC" stroke-width="1.6" /><text x="900" y="473" font-size="13" text-anchor="middle" class="s" fill="#929296">all three <tspan class="m" fill="#73A1DC" font-weight="600">discussed_in</tspan> <tspan fill="#F1F1F4" font-weight="600">Q3 release sync</tspan>, a meeting node</text></g><text x="40" y="530" font-size="13" class="s" fill="#929296">Every point must quote the transcript or it is dropped. Each part is read twice and merged.</text><text x="40" y="550" font-size="13" class="s" fill="#929296">Done and blocked need the words that say so; otherwise a task stays open.</text></svg>
