<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="Use case: Decision log."><title>Decision log</title><desc>Use case: Decision log.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs><rect width="600" height="320" rx="18" fill="#0A0A0C"/><rect x="1" y="1" width="598" height="318" rx="18" fill="#0A0A0C" stroke="#2D2D31" stroke-width="1.2" /><text x="32" y="60" font-size="28" font-weight="800" class="s" fill="#EA6878">Decision log</text><text x="32" y="90" font-size="15" class="s" fill="#929296">When plans change, <tspan fill="#EA6878" font-style="italic" font-weight="600">the newest fact wins.</tspan></text><rect x="32" y="116" width="220" height="140" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="48" y="140" font-size="10" class="m" fill="#EA6878" font-weight="700" letter-spacing="1.6">NOTES</text><text x="48" y="164" font-size="12" class="m" fill="#929296" font-weight="600">2 May</text><text x="48" y="185" font-size="12" class="m" fill="#F1F1F4">launch → May 28</text><text x="48" y="206" font-size="12" class="m" fill="#929296" font-weight="600">20 May</text><text x="48" y="227" font-size="12" class="m" fill="#F1F1F4">launch → June 10</text><rect x="348" y="116" width="220" height="140" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="364" y="140" font-size="10" class="m" fill="#EA6878" font-weight="700" letter-spacing="1.6">THE GRAPH SAYS</text><text x="364" y="178" font-size="26" class="s" fill="#67B36A" font-weight="800">June 10</text><text x="476" y="176" font-size="20" class="s" fill="#67B36A" font-weight="800">✓</text><text x="364" y="208" font-size="12" class="s" fill="#F1F1F4" font-weight="600">newest note wins</text><text x="364" y="230" font-size="11" class="s" fill="#929296">May 28 kept as evidence</text><path d="M262 186 L 338 186" fill="none" stroke="#EA6878" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-rose)" class="flow"/><text x="300" y="176" font-size="10" class="m" fill="#EA6878" font-weight="700" text-anchor="middle" letter-spacing="1.4">RESOLVE</text><rect x="32" y="276" width="118" height="24" rx="12" fill="#EA6878" fill-opacity="0.14"/><text x="91.0" y="292" font-size="11" class="m" fill="#EA6878" font-weight="700" text-anchor="middle" letter-spacing="1">CONTRADICTIONS</text><rect x="158" y="276" width="70" height="24" rx="12" fill="#EA6878" fill-opacity="0.14"/><text x="193.0" y="292" font-size="11" class="m" fill="#EA6878" font-weight="700" text-anchor="middle" letter-spacing="1">HISTORY</text><text x="568" y="293" font-size="11" class="m" fill="#929296" font-weight="700" text-anchor="end" letter-spacing="1.4">DOCS →</text></svg>
