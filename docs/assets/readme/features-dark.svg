<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Knowledge graph, entity resolution, contradiction detection, hybrid search, graph-first answers, meeting intelligence, session memory, code index, workspaces, Notion sync, secure defaults and diagnostics."><title>Twelve capabilities, one graph</title><desc>Knowledge graph, entity resolution, contradiction detection, hybrid search, graph-first answers, meeting intelligence, session memory, code index, workspaces, Notion sync, secure defaults and diagnostics.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs><rect width="1200" height="552" rx="18" fill="#0A0A0C"/><text x="600" y="46" font-size="12" class="s" fill="#929296" font-weight="700" text-anchor="middle" letter-spacing="2.4">TWELVE CAPABILITIES · ONE GRAPH</text><rect x="40" y="72" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="106" r="20" fill="#F2B036" fill-opacity="0.14"/><g transform="translate(60 94) scale(1.0)" fill="none" stroke="#F2B036" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.6"/><circle cx="12" cy="5" r="2.6"/><circle cx="19" cy="16" r="2.6"/><path d="M6.5 16 L10.8 7.3 M13.8 6.6 L17.6 13.8 M7.6 18 L16.4 16.3"/></g><g class="pulse" style="animation-delay:0.00s"><circle cx="285" cy="92" r="3.5" fill="#F2B036"/></g><text x="104" y="112" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Knowledge graph</text><text x="60" y="150" font-size="13" class="s" fill="#929296">Notes become typed facts across</text><text x="60" y="169" font-size="13" class="s" fill="#929296">18 relations, with no manual links.</text><text x="60" y="198" font-size="11" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.4">AUTO-LINKED</text><rect x="325" y="72" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="357" cy="106" r="20" fill="#14BBC2" fill-opacity="0.14"/><g transform="translate(345 94) scale(1.0)" fill="none" stroke="#14BBC2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 L11 12 M3 19 L11 12 M3 12 L20 12 M16 8 L20 12 L16 16"/></g><g class="pulse" style="animation-delay:0.21s"><circle cx="570" cy="92" r="3.5" fill="#14BBC2"/></g><text x="389" y="112" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Entity resolution</text><text x="345" y="150" font-size="13" class="s" fill="#929296">Sarah, Sarah K. and Sarah Khan</text><text x="345" y="169" font-size="13" class="s" fill="#929296">become one person, safely.</text><text x="345" y="198" font-size="11" class="m" fill="#14BBC2" font-weight="700" letter-spacing="1.4">3 NAMES → 1</text><rect x="610" y="72" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="642" cy="106" r="20" fill="#EA6878" fill-opacity="0.14"/><g transform="translate(630 94) scale(1.0)" fill="none" stroke="#EA6878" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L22 20 L2 20 Z"/><path d="M12 9 L12 14"/><circle cx="12" cy="17" r="0.6"/></g><g class="pulse" style="animation-delay:0.42s"><circle cx="855" cy="92" r="3.5" fill="#EA6878"/></g><text x="674" y="112" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Contradiction detection</text><text x="630" y="150" font-size="13" class="s" fill="#929296">Plans that change are caught,</text><text x="630" y="169" font-size="13" class="s" fill="#929296">and the newest fact wins.</text><text x="630" y="198" font-size="11" class="m" fill="#EA6878" font-weight="700" letter-spacing="1.4">NEWEST WINS</text><rect x="895" y="72" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="927" cy="106" r="20" fill="#73A1DC" fill-opacity="0.14"/><g transform="translate(915 94) scale(1.0)" fill="none" stroke="#73A1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 L21 21"/></g><g class="pulse" style="animation-delay:0.63s"><circle cx="1140" cy="92" r="3.5" fill="#73A1DC"/></g><text x="959" y="112" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Hybrid search</text><text x="915" y="150" font-size="13" class="s" fill="#929296">Full-text and vector search</text><text x="915" y="169" font-size="13" class="s" fill="#929296">fused into one ranking.</text><text x="915" y="198" font-size="11" class="m" fill="#73A1DC" font-weight="700" letter-spacing="1.4">WORDS + MEANING</text><rect x="40" y="232" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="266" r="20" fill="#67B36A" fill-opacity="0.14"/><g transform="translate(60 254) scale(1.0)" fill="none" stroke="#67B36A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4 H20 A1 1 0 0 1 21 5 V15 A1 1 0 0 1 20 16 H10 L5 20 V16 H4 A1 1 0 0 1 3 15 V5 A1 1 0 0 1 4 4 Z"/><path d="M8 10 L11 13 L16 7.5"/></g><g class="pulse" style="animation-delay:0.84s"><circle cx="285" cy="252" r="3.5" fill="#67B36A"/></g><text x="104" y="272" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Graph-first answers</text><text x="60" y="310" font-size="13" class="s" fill="#929296">Questions answered from the graph,</text><text x="60" y="329" font-size="13" class="s" fill="#929296">multi-hop, with sources.</text><text x="60" y="358" font-size="11" class="m" fill="#67B36A" font-weight="700" letter-spacing="1.4">CITED</text><rect x="325" y="232" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="357" cy="266" r="20" fill="#14BBC2" fill-opacity="0.14"/><g transform="translate(345 254) scale(1.0)" fill="none" stroke="#14BBC2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11 M12 18 V21"/></g><g class="pulse" style="animation-delay:1.05s"><circle cx="570" cy="252" r="3.5" fill="#14BBC2"/></g><text x="389" y="272" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Meeting intelligence</text><text x="345" y="310" font-size="13" class="s" fill="#929296">Decisions, owners, risks and task</text><text x="345" y="329" font-size="13" class="s" fill="#929296">status, from any transcript.</text><text x="345" y="358" font-size="11" class="m" fill="#14BBC2" font-weight="700" letter-spacing="1.4">QUOTED</text><rect x="610" y="232" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="642" cy="266" r="20" fill="#F2B036" fill-opacity="0.14"/><g transform="translate(630 254) scale(1.0)" fill="none" stroke="#F2B036" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15.5 14"/></g><g class="pulse" style="animation-delay:1.26s"><circle cx="855" cy="252" r="3.5" fill="#F2B036"/></g><text x="674" y="272" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Session memory</text><text x="630" y="310" font-size="13" class="s" fill="#929296">AI conversations captured and</text><text x="630" y="329" font-size="13" class="s" fill="#929296">searchable, word for word.</text><text x="630" y="358" font-size="11" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.4">NEVER LOST</text><rect x="895" y="232" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="927" cy="266" r="20" fill="#67B36A" fill-opacity="0.14"/><g transform="translate(915 254) scale(1.0)" fill="none" stroke="#67B36A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7 L3 12 L8 17 M16 7 L21 12 L16 17 M14 4 L10 20"/></g><g class="pulse" style="animation-delay:1.47s"><circle cx="1140" cy="252" r="3.5" fill="#67B36A"/></g><text x="959" y="272" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Code index</text><text x="915" y="310" font-size="13" class="s" fill="#929296">Every symbol with its file and</text><text x="915" y="329" font-size="13" class="s" fill="#929296">line range, kept current.</text><text x="915" y="358" font-size="11" class="m" fill="#67B36A" font-weight="700" letter-spacing="1.4">FILE · LINE</text><rect x="40" y="392" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="426" r="20" fill="#73A1DC" fill-opacity="0.14"/><g transform="translate(60 414) scale(1.0)" fill="none" stroke="#73A1DC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L21 8 L12 13 L3 8 Z M3 12 L12 17 L21 12 M3 16 L12 21 L21 16"/></g><g class="pulse" style="animation-delay:1.68s"><circle cx="285" cy="412" r="3.5" fill="#73A1DC"/></g><text x="104" y="432" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Workspaces</text><text x="60" y="470" font-size="13" class="s" fill="#929296">Separate graphs for work, home</text><text x="60" y="489" font-size="13" class="s" fill="#929296">and every project.</text><text x="60" y="518" font-size="11" class="m" fill="#73A1DC" font-weight="700" letter-spacing="1.4">ISOLATED</text><rect x="325" y="392" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="357" cy="426" r="20" fill="#F2B036" fill-opacity="0.14"/><g transform="translate(345 414) scale(1.0)" fill="none" stroke="#F2B036" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8 H15.5 M8.5 12 H15.5 M8.5 16 H12.5"/></g><g class="pulse" style="animation-delay:1.89s"><circle cx="570" cy="412" r="3.5" fill="#F2B036"/></g><text x="389" y="432" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Notion, both ways</text><text x="345" y="470" font-size="13" class="s" fill="#929296">Pages sync in; insights are</text><text x="345" y="489" font-size="13" class="s" fill="#929296">written back to each page.</text><text x="345" y="518" font-size="11" class="m" fill="#F2B036" font-weight="700" letter-spacing="1.4">TWO-WAY SYNC</text><rect x="610" y="392" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="642" cy="426" r="20" fill="#EA6878" fill-opacity="0.14"/><g transform="translate(630 414) scale(1.0)" fill="none" stroke="#EA6878" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V8 A4 4 0 0 1 16 8 V11"/></g><g class="pulse" style="animation-delay:2.10s"><circle cx="855" cy="412" r="3.5" fill="#EA6878"/></g><text x="674" y="432" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Secure by default</text><text x="630" y="470" font-size="13" class="s" fill="#929296">API key required, secrets</text><text x="630" y="489" font-size="13" class="s" fill="#929296">redacted, keys never exposed.</text><text x="630" y="518" font-size="11" class="m" fill="#EA6878" font-weight="700" letter-spacing="1.4">LOCKED</text><rect x="895" y="392" width="265" height="142" rx="14" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="927" cy="426" r="20" fill="#67B36A" fill-opacity="0.14"/><g transform="translate(915 414) scale(1.0)" fill="none" stroke="#67B36A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 H7 L10 5 L14 19 L17 12 H22"/></g><g class="pulse" style="animation-delay:2.31s"><circle cx="1140" cy="412" r="3.5" fill="#67B36A"/></g><text x="959" y="432" font-size="16" class="s" fill="#F1F1F4" font-weight="700">Diagnostics</text><text x="915" y="470" font-size="13" class="s" fill="#929296">What is waiting, what failed,</text><text x="915" y="489" font-size="13" class="s" fill="#929296">and the button that fixes it.</text><text x="915" y="518" font-size="11" class="m" fill="#67B36A" font-weight="700" letter-spacing="1.4">SELF-SERVE</text></svg>
