<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="A standup note passes through seven incremental stages: sync, extract, resolve, build graph, summarise, cache and write back. It becomes three quoted facts, one resolved person, a graph and a topic summary."><title>A note's journey through the pipeline</title><desc>A standup note passes through seven incremental stages: sync, extract, resolve, build graph, summarise, cache and write back. It becomes three quoted facts, one resolved person, a graph and a topic summary.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes w1{0%,0.0%{opacity:0}2.0%,12.86%{opacity:1}14.86%,100%{opacity:0}}.w1{animation:w1 12s linear -10.80s infinite}@keyframes w2{0%,12.86%{opacity:0}14.86%,25.71%{opacity:1}27.71%,100%{opacity:0}}.w2{animation:w2 12s linear -10.80s infinite}@keyframes w3{0%,25.71%{opacity:0}27.71%,38.57%{opacity:1}40.57%,100%{opacity:0}}.w3{animation:w3 12s linear -10.80s infinite}@keyframes w4{0%,38.57%{opacity:0}40.57%,51.43%{opacity:1}53.43%,100%{opacity:0}}.w4{animation:w4 12s linear -10.80s infinite}@keyframes w5{0%,51.43%{opacity:0}53.43%,64.29%{opacity:1}66.29%,100%{opacity:0}}.w5{animation:w5 12s linear -10.80s infinite}@keyframes w6{0%,64.29%{opacity:0}66.29%,77.14%{opacity:1}79.14%,100%{opacity:0}}.w6{animation:w6 12s linear -10.80s infinite}@keyframes w7{0%,77.14%{opacity:0}79.14%,90.0%{opacity:1}92.0%,100%{opacity:0}}.w7{animation:w7 12s linear -10.80s infinite}@keyframes r8{0%,13.86%{opacity:0;transform:translateY(6px)}17.86%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r8{animation:r8 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r9{0%,26.71%{opacity:0;transform:translateY(6px)}30.71%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r9{animation:r9 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r10{0%,39.57%{opacity:0;transform:translateY(6px)}43.57%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r10{animation:r10 12s ease-out -10.80s infinite;transform-box:fill-box}@keyframes r11{0%,52.43%{opacity:0;transform:translateY(6px)}56.43%,93.0%{opacity:1;transform:translateY(0)}96.0%,100%{opacity:0}}.r11{animation:r11 12s ease-out -10.80s infinite;transform-box:fill-box}</style></defs><rect width="1200" height="470" rx="18" fill="#0A0A0C"/><rect x="40" y="36" width="340" height="132" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="60" y="62" font-size="12" class="m" fill="#929296">note · standup, 20 May</text><text x="60" y="92" font-size="15" class="s" fill="#F1F1F4">Sarah K. owns the auth migration.</text><text x="60" y="116" font-size="15" class="s" fill="#F1F1F4">It ships on June 10.</text><text x="60" y="140" font-size="15" class="s" fill="#F1F1F4">She reports to Mei Lin.</text><text x="420" y="70" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Seven stages. Each one is incremental:</text><text x="420" y="96" font-size="14" class="s" fill="#929296">a model reply is cached by note, model and prompt,</text><text x="420" y="118" font-size="14" class="s" fill="#929296">so an unchanged note costs nothing to rebuild, and an</text><text x="420" y="140" font-size="14" class="s" fill="#929296">edited one re-reads only itself.</text><path d="M210 168 L 210 196 L 118 196 L 118 206" fill="none" stroke="#F2B036" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)" class="flow"/><rect x="46" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="46" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w1"/><text x="120.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Sync</text><text x="120.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">Notion pull</text><line x1="195" y1="239" x2="205" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="206" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="206" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w2"/><text x="280.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Extract</text><text x="280.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">facts + quotes</text><line x1="355" y1="239" x2="365" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="366" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="366" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w3"/><text x="440.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Resolve</text><text x="440.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">one name each</text><line x1="515" y1="239" x2="525" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="526" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="526" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w4"/><text x="600.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Build graph</text><text x="600.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">PageRank, topics</text><line x1="675" y1="239" x2="685" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="686" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="686" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w5"/><text x="760.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Summarise</text><text x="760.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">label each topic</text><line x1="835" y1="239" x2="845" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="846" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="846" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w6"/><text x="920.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Cache</text><text x="920.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">serve fast</text><line x1="995" y1="239" x2="1005" y2="239" stroke="#929296" stroke-width="1.4" stroke-linecap="round" marker-end="url(#a-mut)"/><rect x="1006" y="210" width="148" height="58" rx="10" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><rect x="1006" y="210" width="148" height="58" rx="10" fill="#F2B036" fill-opacity="0.22" stroke="#F2B036" stroke-width="2" class="w7"/><text x="1080.0" y="235" font-size="14" class="s" fill="#F1F1F4" font-weight="600" text-anchor="middle">Write back</text><text x="1080.0" y="254" font-size="11" class="m" fill="#929296" text-anchor="middle">insights to Notion</text><path d="M280.0 268 L 280.0 288 L 186 288 L 186 300" fill="none" stroke="#2D2D31" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g class="r8"><rect x="40" y="300" width="300" height="150" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="58" y="324" font-size="11" class="s" fill="#F2B036" font-weight="600" letter-spacing="1.6">EXTRACT</text><text x="58" y="352" font-size="12" class="m" fill="#F1F1F4">Sarah K. <tspan fill="#F2B036" font-weight="600">owns</tspan> auth migration</text><text x="58" y="382" font-size="12" class="m" fill="#F1F1F4">auth migration <tspan fill="#F2B036" font-weight="600">scheduled_for</tspan> June 10</text><text x="58" y="412" font-size="12" class="m" fill="#F1F1F4">Sarah K. <tspan fill="#F2B036" font-weight="600">reports_to</tspan> Mei Lin</text><text x="58" y="438" font-size="11" class="s" fill="#929296">each fact keeps the sentence it came from</text></g><path d="M440.0 268 L 440.0 288 L 494 288 L 494 300" fill="none" stroke="#2D2D31" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g class="r9"><rect x="354" y="300" width="280" height="150" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="372" y="324" font-size="11" class="s" fill="#F2B036" font-weight="600" letter-spacing="1.6">RESOLVE</text><rect x="372" y="340" width="52" height="20" rx="10.0" fill="#0A0A0C" stroke="#14BBC2" stroke-width="1.2"/><text x="398.0" y="353.96" font-size="11" class="m" fill="#14BBC2" font-weight="600" text-anchor="middle">Sarah</text><rect x="442" y="340" width="72" height="20" rx="10.0" fill="#0A0A0C" stroke="#14BBC2" stroke-width="1.2"/><text x="478.0" y="353.96" font-size="11" class="m" fill="#14BBC2" font-weight="600" text-anchor="middle">Sarah K.</text><rect x="536" y="340" width="86" height="20" rx="10.0" fill="#0A0A0C" stroke="#14BBC2" stroke-width="1.2"/><text x="579.0" y="353.96" font-size="11" class="m" fill="#14BBC2" font-weight="600" text-anchor="middle">Sarah Khan</text><line x1="494" y1="368" x2="494" y2="392" stroke="#67B36A" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-green)"/><rect x="436" y="398" width="92" height="24" rx="12.0" fill="#67B36A" stroke="#67B36A" stroke-width="1.2"/><text x="482.0" y="414.32" font-size="12" class="m" fill="#0A0A0C" font-weight="600" text-anchor="middle">Sarah Khan</text><text x="372" y="438" font-size="11" class="s" fill="#929296">spelling, initials, meaning</text></g><path d="M600.0 268 L 600.0 288 L 778 288 L 778 300" fill="none" stroke="#2D2D31" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g class="r10"><rect x="648" y="300" width="260" height="150" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="666" y="324" font-size="11" class="s" fill="#F2B036" font-weight="600" letter-spacing="1.6">BUILD GRAPH</text><line x1="694" y1="380" x2="862" y2="360" stroke="#929296" stroke-width="1.2" stroke-linecap="round"/><line x1="862" y1="360" x2="870" y2="420" stroke="#929296" stroke-width="1.2" stroke-linecap="round"/><line x1="694" y1="380" x2="694" y2="432" stroke="#929296" stroke-width="1.2" stroke-linecap="round"/><circle cx="694" cy="380" r="16" fill="#F2B036" class="pulse"/><text x="694" y="352" font-size="11" class="m" fill="#F1F1F4" text-anchor="middle">Sarah Khan</text><circle cx="862" cy="360" r="9" fill="#14BBC2" class="pulse"/><text x="848" y="342" font-size="11" class="m" fill="#F1F1F4" text-anchor="end">auth migration</text><circle cx="870" cy="420" r="7" fill="#73A1DC" class="pulse"/><text x="856" y="424" font-size="11" class="m" fill="#F1F1F4" text-anchor="end">June 10</text><circle cx="694" cy="432" r="8" fill="#67B36A" class="pulse"/><text x="708" y="436" font-size="11" class="m" fill="#F1F1F4">Mei Lin</text></g><path d="M760.0 268 L 760.0 288 L 1038 288 L 1038 300" fill="none" stroke="#2D2D31" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g class="r11"><rect x="922" y="300" width="238" height="150" rx="12" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><text x="940" y="324" font-size="11" class="s" fill="#F2B036" font-weight="600" letter-spacing="1.6">SUMMARISE</text><rect x="940" y="338" width="133" height="20" rx="10.0" fill="#0A0A0C" stroke="#F2B036" stroke-width="1.2"/><text x="1006.5" y="351.96" font-size="11" class="m" fill="#F2B036" font-weight="600" text-anchor="middle">Auth and identity</text><text x="940" y="384" font-size="13" class="s" fill="#F1F1F4">Sarah Khan's auth</text><text x="940" y="404" font-size="13" class="s" fill="#F1F1F4">migration ships June 10;</text><text x="940" y="424" font-size="13" class="s" fill="#F1F1F4">she reports to Mei Lin.</text><text x="940" y="442" font-size="11" class="s" fill="#929296">kept until the topic changes</text></g></svg>
