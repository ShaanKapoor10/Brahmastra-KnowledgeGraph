x="12" fill="#14BBC2" fill-opacity="0.14"/><text x="53.0" y="292" font-size="11" class="m" fill="#14BBC2" font-weight="700" text-anchor="middle" letter-spacing="1">MCP</text><rect x="82" y="276" width="97" height="24" rx="12" fill="#14BBC2" fill-opacity="0.14"/><text x="130.5" y="292" font-size="11" class="m" fill="#14BBC2" font-weight="700" text-anchor="middle" letter-spacing="1">CLAUDE CODE</text><rect x="187" y="276" width="63" height="24" rx="12" fill="#14BBC2" fill-opacity="0.14"/><text x="218.5" y="292" font-size="11" class="m" fill="#14BBC2" font-weight="700" text-anchor="middle" letter-spacing="1">CURSOR</text><text x="568" y="293" font-size="11" class="m" fill="#929296" font-weight="700" text-anchor="end" letter-spacing="1.4">DOCS →</text></svg>
