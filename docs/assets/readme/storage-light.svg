<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Notes and workspaces live in Postgres and cannot be recomputed. The graph in Neo4j is a cache the pipeline rebuilds from the notes. Every derived row has an owner."><title>Source data versus derived data</title><desc>Notes and workspaces live in Postgres and cannot be recomputed. The graph in Neo4j is a cache the pipeline rebuilds from the notes. Every derived row has an owner.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1F"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626369"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DAD7D2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B86B00"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007A90"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#257C3A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C53443"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3461AC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes p1{0%{transform:translate(472px,150px);opacity:0}4%{opacity:1}4.0%{transform:translate(472px,150px)}92.0%{transform:translate(726px,150px)}92%{opacity:1}100%{transform:translate(726px,150px);opacity:0}}.p1{animation:p1 2.4s linear 0s infinite}</style></defs><rect width="1200" height="400" rx="18" fill="#FDFCF9"/><rect x="40" y="40" width="430" height="250" rx="12" fill="#F5F3EF" stroke="#B86B00" stroke-width="1.6" /><text x="62" y="68" font-size="11" class="s" fill="#B86B00" font-weight="600" letter-spacing="1.6">SOURCE · CANNOT BE RECOMPUTED</text><path d="M62 104 L 62 190 A 48.0 12 0 0 0 158 190 L 158 104" fill="#ECE9E3" stroke="#B86B00" stroke-width="1.6"/><ellipse cx="110.0" cy="104" rx="48.0" ry="12" fill="#F5F3EF" stroke="#B86B00" stroke-width="1.6"/><text x="110" y="228" font-size="13" class="s" fill="#1A1A1F" font-weight="600" text-anchor="middle">Postgres</text><text x="110" y="246" font-size="11" class="m" fill="#626369" text-anchor="middle">+ pgvector</text><circle cx="190" cy="110" r="4" fill="#B86B00"/><text x="204" y="115" font-size="15" class="s" fill="#1A1A1F">notes</text><circle cx="190" cy="142" r="4" fill="#B86B00"/><text x="204" y="147" font-size="15" class="s" fill="#1A1A1F">workspaces</text><circle cx="190" cy="174" r="4" fill="#B86B00"/><text x="204" y="179" font-size="15" class="s" fill="#1A1A1F">your review decisions</text><text x="190" y="222" font-size="12" class="s" fill="#626369">hybrid search: words + meaning</text><text x="190" y="242" font-size="12" class="s" fill="#B86B00" font-weight="600">back this up</text><rect x="730" y="40" width="430" height="250" rx="12" fill="#F5F3EF" stroke="#007A90" stroke-width="1.2" /><text x="752" y="68" font-size="11" class="s" fill="#007A90" font-weight="600" letter-spacing="1.6">DERIVED · A CACHE OF THE NOTES</text><path d="M752 104 L 752 190 A 48.0 12 0 0 0 848 190 L 848 104" fill="#ECE9E3" stroke="#007A90" stroke-width="1.6"/><ellipse cx="800.0" cy="104" rx="48.0" ry="12" fill="#F5F3EF" stroke="#007A90" stroke-width="1.6"/><text x="800" y="228" font-size="13" class="s" fill="#1A1A1F" font-weight="600" text-anchor="middle">Neo4j</text><text x="800" y="246" font-size="11" class="m" fill="#626369" text-anchor="middle">or SQLite</text><circle cx="880" cy="110" r="4" fill="#007A90"/><text x="894" y="115" font-size="15" class="s" fill="#1A1A1F">facts and entities</text><circle cx="880" cy="142" r="4" fill="#007A90"/><text x="894" y="147" font-size="15" class="s" fill="#1A1A1F">topics and summaries</text><circle cx="880" cy="174" r="4" fill="#007A90"/><text x="894" y="179" font-size="15" class="s" fill="#1A1A1F">cached model replies</text><text x="880" y="222" font-size="12" class="s" fill="#626369">rebuilt from the notes</text><text x="880" y="242" font-size="12" class="s" fill="#007A90" font-weight="600">at any time</text><path d="M472 150 L 726 150" fill="none" stroke="#B86B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)" class="flow"/><text x="600" y="136" font-size="12" class="s" fill="#1A1A1F" font-weight="600" text-anchor="middle">the pipeline rebuilds</text><text x="600" y="172" font-size="11" class="m" fill="#626369" text-anchor="middle">run_pipeline(full=True)</text><circle r="5" fill="#B86B00" class="p1"/><rect x="40" y="318" width="1120" height="64" rx="12" fill="#ECE9E3" stroke="#DAD7D2" stroke-width="1.2" /><text x="62" y="344" font-size="11" class="s" fill="#626369" font-weight="600" letter-spacing="1.6">OWNERSHIP</text><text x="62" y="368" font-size="13" class="s" fill="#1A1A1F">Every derived record has an owner. Edit or delete a source, and everything built from it follows, automatically.</text></svg>
