<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Sarah, Sarah K. and Sarah Khan merge into one entity. Brahmastra v3 versus Brahmastra, an activity versus its object, and the same name in two workspaces are refused."><title>Entity resolution</title><desc>Sarah, Sarah K. and Sarah Khan merge into one entity. Brahmastra v3 versus Brahmastra, an activity versus its object, and the same name in two workspaces are refused.</desc><defs><marker id="a-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F1F1F4"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#929296"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2D2D31"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2B036"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14BBC2"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#67B36A"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EA6878"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#73A1DC"/></marker><style>
.s{font-family:ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:6 9;animation:mv 1.5s linear infinite}
.flow-slow{stroke-dasharray:4 10;animation:mv 3s linear infinite}
.flow-back{stroke-dasharray:6 9;animation:mv 1.5s linear infinite reverse}
@keyframes mv{to{stroke-dashoffset:-30}}
.pulse{animation:pl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,start) infinite}
@keyframes bk{to{visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes d1{0%,15.0%{transform:translate(0,0)}40.0%,80.0%{transform:translate(70px,28.8px)}86.0%,100%{transform:translate(0,0)}}.d1{animation:d1 7s ease-in-out -6.30s infinite}@keyframes d2{0%,15.0%{transform:translate(0,0)}40.0%,80.0%{transform:translate(70px,-6.3px)}86.0%,100%{transform:translate(0,0)}}.d2{animation:d2 7s ease-in-out -6.30s infinite}@keyframes d3{0%,15.0%{transform:translate(0,0)}40.0%,80.0%{transform:translate(70px,-41.4px)}86.0%,100%{transform:translate(0,0)}}.d3{animation:d3 7s ease-in-out -6.30s infinite}@keyframes d4{0%,30.0%{transform:translate(0,0)}36.0%,70.0%{transform:translate(-10px,0px)}76.0%,100%{transform:translate(0,0)}}.d4{animation:d4 7s ease-in-out -6.30s infinite}@keyframes d5{0%,30.0%{transform:translate(0,0)}36.0%,70.0%{transform:translate(10px,0px)}76.0%,100%{transform:translate(0,0)}}.d5{animation:d5 7s ease-in-out -6.30s infinite}@keyframes d6{0%,38.0%{transform:translate(0,0)}44.0%,70.0%{transform:translate(-10px,0px)}76.0%,100%{transform:translate(0,0)}}.d6{animation:d6 7s ease-in-out -6.30s infinite}@keyframes d7{0%,38.0%{transform:translate(0,0)}44.0%,70.0%{transform:translate(10px,0px)}76.0%,100%{transform:translate(0,0)}}.d7{animation:d7 7s ease-in-out -6.30s infinite}@keyframes d8{0%,46.0%{transform:translate(0,0)}52.0%,70.0%{transform:translate(-10px,0px)}76.0%,100%{transform:translate(0,0)}}.d8{animation:d8 7s ease-in-out -6.30s infinite}@keyframes d9{0%,46.0%{transform:translate(0,0)}52.0%,70.0%{transform:translate(10px,0px)}76.0%,100%{transform:translate(0,0)}}.d9{animation:d9 7s ease-in-out -6.30s infinite}</style></defs><rect width="1200" height="350" rx="18" fill="#0A0A0C"/><text x="48" y="50" font-size="11" class="s" fill="#929296" font-weight="600" letter-spacing="1.6">SAME PERSON, THREE NAMES</text><text x="640" y="50" font-size="11" class="s" fill="#929296" font-weight="600" letter-spacing="1.6">LOOKS ALIKE, IS NOT</text><line x1="610" y1="40" x2="610" y2="330" stroke="#2D2D31" stroke-width="1.2" stroke-linecap="round"/><g class="d1"><rect x="48" y="92" width="210" height="46" rx="23" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="115" r="6" fill="#14BBC2"/><text x="88" y="113" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Sarah</text><text x="88" y="129" font-size="11" class="m" fill="#929296">standup note</text></g><path d="M260 115 C 340 115, 360 176, 428 176" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)" opacity="0.8" class="flow"/><g class="d2"><rect x="48" y="170" width="210" height="46" rx="23" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="193" r="6" fill="#14BBC2"/><text x="88" y="191" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Sarah K.</text><text x="88" y="207" font-size="11" class="m" fill="#929296">Notion page</text></g><path d="M260 193 C 340 193, 360 176, 428 176" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)" opacity="0.8" class="flow"/><g class="d3"><rect x="48" y="248" width="210" height="46" rx="23" fill="#141417" stroke="#2D2D31" stroke-width="1.2" /><circle cx="72" cy="271" r="6" fill="#14BBC2"/><text x="88" y="269" font-size="15" class="s" fill="#F1F1F4" font-weight="600">Sarah Khan</text><text x="88" y="285" font-size="11" class="m" fill="#929296">Q3 meeting</text></g><path d="M260 271 C 340 271, 360 176, 428 176" fill="none" stroke="#14BBC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)" opacity="0.8" class="flow"/><circle cx="480" cy="176" r="46" fill="#67B36A" fill-opacity="0.22" class="breathe"/><circle cx="480" cy="176" r="30" fill="#67B36A" class="pulse"/><text x="480" y="181" font-size="18" class="s" fill="#0A0A0C" font-weight="700" text-anchor="middle">1</text><text x="480" y="244" font-size="15" class="s" fill="#F1F1F4" font-weight="700" text-anchor="middle">Sarah Khan</text><text x="480" y="262" font-size="12" class="s" fill="#929296" text-anchor="middle">one entity, three mentions</text><text x="48" y="312" font-size="12" class="s" fill="#929296">Signals: spelling (Jaro-Winkler), initials, acronyms,</text><text x="48" y="330" font-size="12" class="s" fill="#929296">and meaning (sentence embeddings).</text><g class="d4"><rect x="640" y="82" width="98" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="689.0" y="101.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Brahmastra</text></g><g class="d5"><rect x="790" y="82" width="120" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="850.0" y="101.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Brahmastra v3</text></g><g class="blink" style="animation-delay:0.0s"><line x1="757" y1="90" x2="771" y2="104" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/><line x1="771" y1="90" x2="757" y2="104" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/></g><text x="640" y="134" font-size="12" class="s" fill="#EA6878" font-weight="500">a release is not the product</text><g class="d6"><rect x="640" y="164" width="113" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="696.5" y="183.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">backend/.env</text></g><g class="d7"><rect x="805" y="164" width="172" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="891.0" y="183.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">loading backend/.env</text></g><g class="blink" style="animation-delay:0.4s"><line x1="772" y1="172" x2="786" y2="186" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/><line x1="786" y1="172" x2="772" y2="186" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/></g><text x="640" y="216" font-size="12" class="s" fill="#EA6878" font-weight="500">an activity is not its object</text><g class="d8"><rect x="640" y="246" width="113" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="696.5" y="265.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Sarah · work</text></g><g class="d9"><rect x="805" y="246" width="143" height="30" rx="15.0" fill="#0A0A0C" stroke="#F1F1F4" stroke-width="1.2"/><text x="876.5" y="265.32" font-size="12" class="m" fill="#F1F1F4" font-weight="600" text-anchor="middle">Sarah · personal</text></g><g class="blink" style="animation-delay:0.8s"><line x1="772" y1="254" x2="786" y2="268" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/><line x1="786" y1="254" x2="772" y2="268" stroke="#EA6878" stroke-width="2.4" stroke-linecap="round"/></g><text x="640" y="298" font-size="12" class="s" fill="#EA6878" font-weight="500">workspaces never merge</text><text x="640" y="330" font-size="12" class="s" fill="#929296">Rules on spelling decide first; a model judge only confirms.</text></svg>
