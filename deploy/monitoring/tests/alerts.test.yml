# promtool test rules deploy/monitoring/tests/alerts.test.yml
# Proves the alerts fire when they should -- and stay quiet when they should not.
rule_files:
  - ../rules/brahmastra.rules.yml
evaluation_interval: 1m

tests:
  - name: the graph engine down for 5 minutes is a warning, not a page
    interval: 1m
    input_series:
      - series: brahmastra_graph_up
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: BrahmastraGraphEngineDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The knowledge-graph engine (Neo4j) is unavailable; the product is degraded"
              description: "Notes, search and Ask still work; the dashboard shows the last saved graph with a banner."
              runbook_url: "https://github.com/ShaanKapoor10/vaultgraph-qy/blob/product/launch/docs/RUNBOOK.md#graph-engine-down"

  - name: a backup older than 26 hours pages
    interval: 1h
    input_series:
      - series: brahmastra_backup_last_success_timestamp_seconds
        values: "0x30"
    alert_rule_test:
      - eval_time: 25h
        alertname: BrahmastraBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: BrahmastraBackupStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "No successful backup for more than 26 hours"
              description: "The newest good backup is 1d 3h 0m 0s old."
              runbook_url: "https://github.com/ShaanKapoor10/vaultgraph-qy/blob/product/launch/docs/RUNBOOK.md#backup-failed"

  - name: a fast error burn pages, a trickle does not
    interval: 1m
    input_series:
      # 100 requests/min, 10% failing: 20x the 0.5% budget.
      - series: 'brahmastra_http_requests_total{method="GET",route="/notes",status_class="2xx"}'
        values: "0+90x70"
      - series: 'brahmastra_http_requests_total{method="GET",route="/notes",status_class="5xx"}'
        values: "0+10x70"
      # Health probes failing must not count: they are outside the SLI.
      - series: 'brahmastra_http_requests_total{method="GET",route="/health/ready",status_class="5xx"}'
        values: "0+1000x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: BrahmastraErrorBudgetFastBurn
        exp_alerts:
          - exp_labels: {severity: critical, slo: availability}
            exp_annotations:
              summary: "API errors are burning the monthly error budget 14x too fast"
              description: "10% of API requests failed over the last hour (objective: 99.5% succeed)."
              runbook_url: "https://github.com/ShaanKapoor10/vaultgraph-qy/blob/product/launch/docs/RUNBOOK.md#error-budget-burn"

  - name: a healthy service raises nothing
    interval: 1m
    input_series:
      - series: 'brahmastra_http_requests_total{method="GET",route="/notes",status_class="2xx"}'
        values: "0+100x70"
      - series: brahmastra_graph_up
        values: "1x70"
      - series: brahmastra_backup_last_attempt_ok
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: BrahmastraErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: BrahmastraGraphEngineDown
        exp_alerts: []
      - eval_time: 65m
        alertname: BrahmastraBackupFailed
        exp_alerts: []
