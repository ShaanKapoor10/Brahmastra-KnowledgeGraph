# Prometheus for one Brahmastra install (compose profile `monitoring`).
#
# Scrapes the backend on the internal network (its /metrics is refused at the
# edge), the host (node_exporter) and every container (cAdvisor). A company's
# own monitoring can federate from this Prometheus (/federate) or receive its
# data by remote_write -- add a `remote_write:` block below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # ${DOMAIN} is expanded because Prometheus runs with --enable-feature=expand-external-labels.
  external_labels:
    instance: ${DOMAIN}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: brahmastra
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8001"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Only this project's containers; a shared host has others.
      - source_labels: [container_label_com_docker_compose_project]
        regex: brahmastra
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
