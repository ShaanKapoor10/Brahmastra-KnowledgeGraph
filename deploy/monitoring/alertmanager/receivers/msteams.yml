  - name: team
    msteams_configs:
      - webhook_url_file: /tmp/am/receiver_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[{{ .CommonLabels.severity | toUpper }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }} Runbook: {{ .Annotations.runbook_url }}{{ end }}'
