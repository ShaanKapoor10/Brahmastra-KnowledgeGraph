# Brahmastra -- production deployment, for any host that runs Docker.
#
#   cd deploy && ./setup.sh              first install (idempotent)
#   ./upgrade.sh 0.3.0                   upgrade with backup + automatic rollback
#
# Every value comes from deploy/.env.production (see .env.production.example);
# nothing here is specific to one organisation.
#
# NETWORKS. Two, so the databases can never be reached from outside:
#
#   edge      ordinary bridge: Caddy, the dashboard, and the containers that need
#             OUTBOUND internet (backend for LLM APIs and Notion, backup for S3).
#   internal  `internal: true`: no route to the outside at all, in or out.
#             Postgres and Neo4j are ONLY here, with no published ports.
#
#   Only Caddy publishes ports (80/443). Everything else is reachable only
#   through it, or not at all.
#
# HARDENING (CIS Docker Benchmark 5.x): every service drops all Linux
# capabilities and adds back only what its entrypoint needs, sets
# no-new-privileges, has a memory limit and a restart policy, and keeps /tmp on
# tmpfs. The app containers (backend, frontend, Caddy) also run with a
# read-only root filesystem. Postgres and Neo4j keep a writable root because
# their entrypoints generate config at start; their data is on volumes.
#
# VERSIONS. Every image is pinned. The app images are tagged with
# BRAHMASTRA_VERSION and the file refuses to start without it -- never :latest,
# so a restart can never silently change what is running.

name: brahmastra

x-logging: &logging
  # Rotate container logs, or a busy instance fills the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

x-neo4j: &neo4j
  <<: *hardening
  image: neo4j:5.26.2-community@sha256:099b9f74968c123209972835417985ed2a1cc19c0422c0753a313e26a736c365
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
  environment:
    NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    # Explicit memory, so the JVM sizes itself to this container rather than
    # to the host, and so heap + page cache + overhead fit inside mem_limit.
    NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
    NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
    NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    NEO4J_PLUGINS: '[]'
    # Not NEO4J_*: the image turns every NEO4J_ variable into a server setting.
    HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
  tmpfs: ["/tmp:size=128m"]
  networks: [internal]
  mem_limit: ${NEO4J_MEMORY:-2g}
  healthcheck:
    # Bolt, with a real query: HTTP answers before Bolt does.
    test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 40s

x-app-env: &app-env
  BRAHMASTRA_ENV: production
  BRAHMASTRA_VERSION: ${BRAHMASTRA_VERSION:?set BRAHMASTRA_VERSION in .env.production}
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  GRAPH_BACKEND: neo4j
  NOTE_BACKEND: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: brahmastra
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: brahmastra
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
  NEO4J_ENCRYPTED: "0"
  BRAHMASTRA_DB: /data/concept_graph.db
  BRAHMASTRA_DATA_DIR: /data
  BRAHMASTRA_CHECKPOINT_DIR: /data/checkpoints
  BRAHMASTRA_WORKSPACE: ${BRAHMASTRA_WORKSPACE:-default}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  GROQ_API_KEYS: ${GROQ_API_KEYS:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  OPENCODE_MODEL: ${OPENCODE_MODEL:-}
  OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
  NOTION_TOKEN: ${NOTION_TOKEN:-}
  NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
  BRAHMASTRA_API_KEY: ${BRAHMASTRA_API_KEY:-}
  BRAHMASTRA_SETUP_TOKEN: ${BRAHMASTRA_SETUP_TOKEN:-}
  BRAHMASTRA_KEY_ADMIN: ${BRAHMASTRA_KEY_ADMIN:-}
  RATE_LIMITS: ${RATE_LIMITS:-}
  SNAPSHOT_REFRESH_MINUTES: ${SNAPSHOT_REFRESH_MINUTES:-30}
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

services:
  caddy:
    <<: *hardening
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    # Binding 80/443 is the one privilege the edge needs.
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS to your ACME email, or "internal" for a test install}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificates: keep them, or Let's Encrypt rate-limits re-issuing
      - caddy-config:/config
    tmpfs: ["/tmp:size=64m"]
    networks: [edge]
    mem_limit: 256m
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-brahmastra-frontend:${BRAHMASTRA_VERSION:?set BRAHMASTRA_VERSION}}
    build:
      context: ../frontend
    read_only: true
    environment:
      BRAHMASTRA_ENV: production
      BACKEND_URL: http://backend:8001
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=128m,uid=10001"]
    networks: [edge, internal]
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_started

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-brahmastra-backend:${BRAHMASTRA_VERSION:?set BRAHMASTRA_VERSION}}
    build:
      context: ../backend
    read_only: true
    environment:
      <<: *app-env
      # Caddy is the only thing in front of this, and it sets X-Forwarded-For
      # from the real client; login lockout counts per address.
      TRUST_PROXY_HEADERS: "1"
      CORS_ORIGINS: ""
      MCP_HTTP: ${MCP_HTTP:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Each uvicorn worker writes its metric files here (on the tmpfs, emptied
      # at start); /metrics merges them (brahmastra/metrics.py).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      BRAHMASTRA_OPS_STATE: /ops-state
      LOG_FORMAT: json
    volumes:
      - brahmastra-data:/data
      # The backup job's outcomes, read-only, so backup age is a metric.
      - ops-state:/ops-state:ro
    tmpfs: ["/tmp:size=256m"]
    # edge for OUTBOUND only (LLM providers, Notion); it publishes nothing.
    networks: [edge, internal]
    mem_limit: ${BACKEND_MEMORY:-2g}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    # The entrypoint fixes data-directory ownership as root, then drops to the
    # postgres user; these are exactly the capabilities that needs.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_USER: brahmastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: brahmastra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs: ["/tmp:size=128m", "/var/run/postgresql:size=16m"]
    networks: [internal]
    mem_limit: ${POSTGRES_MEMORY:-1g}
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brahmastra -d brahmastra"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    <<: *neo4j
    volumes:
      # Blue/green: the graph lives on one of two volumes. deploy/rebuild-graph.sh
      # rebuilds into the other one, verifies it, then points this at it.
      - ${NEO4J_DATA_VOLUME:-neo4j-data}:/data
      - neo4j-logs:/logs

  # Only during a rebuild (deploy/rebuild-graph.sh): an empty Neo4j on the
  # INACTIVE volume, which the rebuild fills while the live graph keeps serving.
  neo4j-shadow:
    <<: *neo4j
    profiles: ["rebuild"]
    volumes:
      - ${NEO4J_SHADOW_VOLUME:-neo4j-data-b}:/data

  backup:
    <<: *hardening
    image: ${BACKUP_IMAGE:-brahmastra-backup:${BRAHMASTRA_VERSION:?set BRAHMASTRA_VERSION}}
    build:
      context: ./backup
    # Runs as the image's postgres user: pg_dump needs no privilege, and the
    # weekly restore test starts a throwaway server, which refuses to run as root.
    user: postgres
    environment:
      BRAHMASTRA_ENV: production
      TZ: ${TZ:-UTC}
      PGHOST: postgres
      PGUSER: brahmastra
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: brahmastra
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-on}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      RESTORE_TEST_WEEKDAY: ${RESTORE_TEST_WEEKDAY:-7}
      RESTORE_TEST_TIME: ${RESTORE_TEST_TIME:-04:00}
      BACKUP_KEEP_LOCAL_DAYS: ${BACKUP_KEEP_LOCAL_DAYS:-7}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-5}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      RESTORE_TEST_HEARTBEAT_URL: ${RESTORE_TEST_HEARTBEAT_URL:-}
      INSTANCE_NAME: ${DOMAIN:-brahmastra}
      RESTIC_CACHE_DIR: /scratch/restic-cache
    volumes:
      - backups:/backups
      - backup-scratch:/scratch
      - ops-state:/ops-state
    tmpfs: ["/tmp:size=64m"]
    # internal to reach Postgres; edge for the off-host copy (S3).
    networks: [edge, internal]
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy

  # Runs the pipeline on a timer and syncs Notion. Opt in, because it edits
  # the Notion workspace it is pointed at:  docker compose --profile scheduler up -d
  scheduler:
    <<: *hardening
    profiles: ["scheduler"]
    image: ${BACKEND_IMAGE:-brahmastra-backend:${BRAHMASTRA_VERSION:?set BRAHMASTRA_VERSION}}
    read_only: true
    command: ["python", "-m", "brahmastra.live_sync"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      POLL_INTERVAL: ${POLL_INTERVAL:-900}
    volumes:
      - brahmastra-data:/data
    tmpfs: ["/tmp:size=256m"]
    networks: [edge, internal]
    mem_limit: ${BACKEND_MEMORY:-2g}
    depends_on:
      backend:
        condition: service_healthy

  # ===================================================================== monitoring
  # Opt in: COMPOSE_PROFILES=monitoring in .env.production (or --profile monitoring).
  # Prometheus and Grafana listen on 127.0.0.1 only: reach them over an SSH
  # tunnel (docs/OBSERVABILITY.md), never from the internet.

  prometheus:
    <<: *hardening
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --enable-feature=expand-external-labels
      - --web.listen-address=0.0.0.0:9090
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # internal: to scrape the backend; monitoring: the exporters and Alertmanager.
    networks: [internal, monitoring]
    mem_limit: 1g

  alertmanager:
    <<: *hardening
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    read_only: true
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_RECEIVER: ${ALERT_RECEIVER:-slack}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      WATCHDOG_URL: ${WATCHDOG_URL:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    tmpfs: ["/tmp:size=8m,mode=0700,uid=65534"]
    # monitoring has outbound access, for the Slack/Teams/webhook receiver.
    networks: [monitoring]
    mem_limit: 256m

  grafana:
    <<: *hardening
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.3.1@sha256:147620479985b5780600dea24223c71eb8525e01727cce7fcd4bba8896d66d60
    read_only: true
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run setup.sh, which generates GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3002}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: ["/tmp:size=64m"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    networks: [monitoring]
    mem_limit: 512m

  node-exporter:
    <<: *hardening
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    read_only: true
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      # rslave (mount propagation) is the documented setting on Linux hosts.
      # Docker Desktop cannot propagate mounts: set NODE_EXPORTER_MOUNT=ro there.
      - /:/host:${NODE_EXPORTER_MOUNT:-ro,rslave}
    networks: [monitoring]
    mem_limit: 128m

  # cAdvisor reads every container's cgroups and the Docker state, so it is the
  # one service that runs privileged -- the documented exception to the
  # hardening above (docs/OBSERVABILITY.md). It publishes nothing.
  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    restart: unless-stopped
    logging: *logging
    privileged: true
    devices: ["/dev/kmsg"]
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    mem_limit: 256m

networks:
  edge: {}
  internal:
    internal: true
  # Exporters, Prometheus, Alertmanager and Grafana. Not internal: Alertmanager
  # must reach the alert receiver, and Prometheus and Grafana publish on 127.0.0.1.
  monitoring: {}

volumes:
  brahmastra-data:
  postgres-data:
  neo4j-data:
  neo4j-data-b:
  neo4j-logs:
  caddy-data:
  caddy-config:
  backups:
  backup-scratch:
  ops-state:
  prometheus-data:
  alertmanager-data:
  grafana-data:
